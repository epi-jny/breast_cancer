[project]
name = "gmic-breast-cancer"
version = "0.1.0"
description = "Pipeline de detection du cancer du sein sur mammographies (GMIC)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "opencv-python-headless>=4.5",
    "pydicom>=2.3",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "h5py>=3.0",
    "tqdm>=4.60",
    "torch>=2.4,<2.5",
    "torchvision>=0.19,<0.20",
    "matplotlib>=3.4",
    "seaborn>=0.13",
    "imageio>=2.9",
    "pillow>=9.0",
    "pyyaml>=6.0",
    "jupyter-cache>=1.0",
    "ipython>=8.0",
    "ipykernel>=7.2.0",
]

[project.scripts]
gmic-pipeline = "scripts.run_gmic_pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "utils"]

[tool.black]
line-length = 100
target-version = ["py311"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

# Index PyTorch CUDA 12.1 — compatible avec drivers NVIDIA >= 530
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
